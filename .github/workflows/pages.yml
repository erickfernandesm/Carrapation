# Publica o Carrapation no GitHub Pages a cada envio para a branch main.
#
# Para ligar: no repositorio, va em Settings, Pages, e em "Source" escolha
# "GitHub Actions". Depois disso o site sobe sozinho a cada push.

name: Publicar no Pages

on:
  push:
    branches: [main]
  # Permite disparar na mao pela aba Actions.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Um envio por vez. Se chegar outro no meio, o antigo e cancelado.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
