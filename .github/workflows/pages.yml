# Publica o Carrapation no GitHub Pages a cada envio para a branch main.
#
# O proprio fluxo liga o Pages na primeira execucao. Se por algum motivo isso
# nao funcionar, de para ligar na mao em Settings, Pages, e em "Source"
# escolher "GitHub Actions".

name: Publicar no Pages

on:
  push:
    branches: [main]
  # Permite disparar na mao pela aba Actions.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Um envio por vez. Se chegar outro no meio, o antigo e cancelado.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      # enablement liga o Pages sozinho na primeira vez. Sem isso, o passo
      # falha ate alguem ir em Settings, Pages e escolher GitHub Actions.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
