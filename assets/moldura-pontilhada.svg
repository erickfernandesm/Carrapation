<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Anel cheio por baixo e anel tracejado por cima, girado meio passo,
       para os tracos caírem entre as marcas do de baixo. -->
  <circle cx="50" cy="50" r="40" fill="none" stroke="#0f7a6c" stroke-width="3.4"
          stroke-dasharray="6 6" stroke-linecap="round"/>
  <circle cx="50" cy="50" r="45.5" fill="none" stroke="#0f7a6c" stroke-width="1.6"
          stroke-dasharray="2 6" stroke-linecap="round" opacity=".7"
          transform="rotate(6 50 50)"/>
</svg>
