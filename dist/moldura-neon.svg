<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset=".4" stop-color="#818cf8"/>
      <stop offset=".7" stop-color="#e879f9"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="brilho" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.6" result="borrado"/>
      <feMerge>
        <feMergeNode in="borrado"/>
        <feMergeNode in="borrado"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <circle cx="50" cy="50" r="40" fill="none" stroke="url(#neon)" stroke-width="4.5" filter="url(#brilho)"/>
  <circle cx="50" cy="50" r="40" fill="none" stroke="#ffffff" stroke-width="1.1" opacity=".65"/>
</svg>
