<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="noite" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#312e81"/>
      <stop offset=".5" stop-color="#6d28d9"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <!-- Uma estrela de quatro pontas, desenhada no topo. As copias giram. -->
    <path id="estrela"
          d="M50 4.5c1.1 4.4 2.6 5.9 7 7-4.4 1.1-5.9 2.6-7 7-1.1-4.4-2.6-5.9-7-7 4.4-1.1 5.9-2.6 7-7z"
          fill="#fde68a"/>
  </defs>

  <circle cx="50" cy="50" r="39.5" fill="none" stroke="url(#noite)" stroke-width="5"/>

  <use href="#estrela" transform="rotate(0 50 50)"/>
  <use href="#estrela" transform="rotate(45 50 50)"/>
  <use href="#estrela" transform="rotate(90 50 50)"/>
  <use href="#estrela" transform="rotate(135 50 50)"/>
  <use href="#estrela" transform="rotate(180 50 50)"/>
  <use href="#estrela" transform="rotate(225 50 50)"/>
  <use href="#estrela" transform="rotate(270 50 50)"/>
  <use href="#estrela" transform="rotate(315 50 50)"/>
